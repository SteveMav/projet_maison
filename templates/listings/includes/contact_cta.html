{% if listing.availability_status == "available" %}
  <div class="contact-cta-wrapper">
    <p class="contact-cta-note">Maison crée une demande attribuée avant d'ouvrir WhatsApp.</p>
    <button
      type="button"
      class="button button-primary button-full contact-whatsapp-btn"
      data-contact-whatsapp
      data-listing-id="{{ listing.id }}"
      data-user-authenticated="{% if user.is_authenticated %}true{% else %}false{% endif %}"
      data-id-required="{% if user.is_authenticated and not user.whatsapp_consent %}true{% else %}false{% endif %}"
    >
      Contacter sur WhatsApp
    </button>
    
    <div id="handoff-error-cta" class="handoff-error-container handoff-error" role="alert" aria-live="polite" hidden>
      <span class="error-icon" aria-hidden="true">⚠️</span>
      <span class="error-text"></span>
    </div>

    <div id="handoff-success-cta" class="handoff-success-container handoff-success" role="alert" aria-live="polite" hidden>
      <p class="success-message">
        <span class="success-icon" aria-hidden="true">✓</span>
        Votre demande de contact a été enregistrée. Si vous n'êtes pas redirigé automatiquement, 
        <a id="handoff-fallback-link" href="#" class="fallback-link" target="_blank">cliquez ici pour ouvrir WhatsApp</a>.
      </p>
    </div>
  </div>
{% endif %}
