{% url "accounts:login" as login_url %}
{% url "accounts:register" as register_url %}
{% firstof auth_gate_next request.get_full_path as gate_next %}

<div class="auth-gate" data-auth-gate>
  <p class="auth-gate-copy">Connectez-vous pour continuer.</p>
  <div class="action-row">
    <a class="button button-primary" href="{{ login_url }}?next={{ gate_next|urlencode }}">Se connecter</a>
    <a class="button button-secondary" href="{{ register_url }}?next={{ gate_next|urlencode }}">Creer un compte</a>
  </div>
</div>
